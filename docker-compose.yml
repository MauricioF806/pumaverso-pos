services:
  postgres:
    image: postgres:17-alpine
    container_name: pumaverso-postgres
    environment:
      POSTGRES_USER: pumaverso
      POSTGRES_PASSWORD: pumaverso
      POSTGRES_DB: pumaverso_central
    ports:
      - "5432:5432"
    volumes:
      - pumaverso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumaverso -d pumaverso_central"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pumaverso_pgdata: