[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pumaverso-contratos"
version = "0.1.0"
description = "Contrato compartido de eventos entre tienda y central en Pumaverso POS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.7,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"